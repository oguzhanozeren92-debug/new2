services:
  - type: web
    name: tarlapusula-model-gateway-shadow
    runtime: python
    repo: https://github.com/oguzhanozeren92-debug/new2
    branch: main
    plan: free
    region: frankfurt
    autoDeploy: false
    buildCommand: cd services/model-gateway && pip install -r requirements.txt
    startCommand: cd services/model-gateway && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_GATEWAY_ENV
        value: production
      - key: MODEL_GATEWAY_SHARED_KEY
        sync: false
