name: TarlaPusula Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (legacy debt report)
        continue-on-error: true
        run: npm run typecheck
      - name: Lint (legacy debt report)
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  model-gateway-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile model gateway Python
        run: python -m compileall -q services/model-gateway
