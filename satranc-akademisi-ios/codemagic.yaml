workflows:
  ios-test:
    name: Satranç Akademisi iPhone simulator verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: XcodeGen setup
        script: brew install xcodegen
      - name: Generate icon and project
        script: |
          swift Tools/generate_icon.swift
          xcodegen generate
      - name: Resolve SPM dependencies
        script: xcodebuild -resolvePackageDependencies -project SatrancAkademisi.xcodeproj -scheme SatrancAkademisi
      - name: Build for iPhone Simulator (unsigned)
        script: xcodebuild -project SatrancAkademisi.xcodeproj -scheme SatrancAkademisi -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
