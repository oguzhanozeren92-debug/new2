workflows:
  ios-test:
    name: Satranç Akademisi - iPhone Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate native icon and Xcode project
        script: |
          cd satranc-akademisi-ios
          swift Tools/generate_icon.swift
          xcodegen generate
      - name: Resolve Swift packages
        script: |
          cd satranc-akademisi-ios
          xcodebuild -resolvePackageDependencies -project SatrancAkademisi.xcodeproj -scheme SatrancAkademisi
      - name: Compile unsigned iPhone simulator app
        script: |
          cd satranc-akademisi-ios
          xcodebuild -project SatrancAkademisi.xcodeproj -scheme SatrancAkademisi -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
