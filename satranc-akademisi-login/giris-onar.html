<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081523"><title>Satranç Akademisi · Giriş Onarımı</title><style>html,body{height:100%;margin:0;background:#081523;color:#f0d4a0;font:15px system-ui}body{display:grid;place-items:center;text-align:center}.loader{width:42px;height:42px;border:3px solid #665339;border-top-color:#f5c682;border-radius:50%;margin:0 auto 20px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#error{max-width:310px;padding:20px;line-height:1.6}</style></head><body><main><div class="loader"></div><div id="error">Satranç Akademisi açılıyor...</div></main><script>(function(){try{var KEY="satranc-akademisi-v1";var p={};try{p=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}var requested=new URLSearchParams(location.search).get("rumuz");var old=typeof p.nick==="string"?p.nick.trim():"";var nick=requested&&requested.trim().length>=3?requested.trim().slice(0,20):old.length>=3?old:"SatrançOyuncusu";p=Object.assign({nick:"",level:"Biraz biliyorum",xp:0,done:[],puzzlesDone:[],streakDay:"",streak:0},p);p.nick=nick;if(!p.level)p.level="Biraz biliyorum";localStorage.setItem(KEY,JSON.stringify(p));if(JSON.parse(localStorage.getItem(KEY)||"{}").nick!==nick)throw Error("Profil kaydedilemedi");location.replace("/?giris=onarildi");}catch(e){document.getElementById("error").textContent="Tarayıcı giriş bilgisini kaydedemedi. Safari'de açıp tekrar deneyebilirsin."}})();</script></body></html>
